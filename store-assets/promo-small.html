<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light" />
<title>small promo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas {
    position: relative; width: 440px; height: 280px; display: grid; place-items: center;
    background:
      radial-gradient(300px 220px at 88% 6%, #e7e3ff 0%, rgba(231,227,255,0) 62%),
      radial-gradient(280px 200px at 4% 100%, #e6efff 0%, rgba(230,239,255,0) 58%),
      linear-gradient(180deg, #ffffff 0%, #f3f4fa 100%);
  }
  .inner { text-align: center; }
  .mark {
    width: 62px; height: 62px; margin: 0 auto; border-radius: 18px;
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 32px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    box-shadow: 0 12px 28px rgba(99, 102, 241, .35);
  }
  .name { margin-top: 16px; font-size: 31px; font-weight: 800; letter-spacing: -.02em; color: #14161d; }
  .tag { margin-top: 8px; font-size: 14.5px; color: #5b6172; }
  .pill {
    display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px;
    background: #eef0ff; color: #4f46e5; font-size: 11px; font-weight: 800; letter-spacing: .07em;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="inner">
      <div class="mark">Y</div>
      <div class="name">Stop Yapping</div>
      <div class="tag">Turn any page into a 30-second summary</div>
      <div class="pill">BRING YOUR OWN AI KEY</div>
    </div>
  </div>
</body>
</html>
